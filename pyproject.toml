[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "i37-multiscale-coe"
version = "1.0.0"
description = "Reproducible I37 multiscale observed-data imputation with shared experts and consistency projection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3,<3", "numpy>=1.24,<3", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["src"]
