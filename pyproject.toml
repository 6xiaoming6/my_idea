[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stmoe-imputer-v2"
version = "0.2.0"
description = "Spatiotemporal imputation experiments with Temporal-Spatial Chain-of-Experts and legacy MoE backbones."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
    "tqdm>=4.66",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
taxibj = ["pandas>=2.0"]
chap = ["xarray>=2024.1", "h5netcdf>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
