[file]
data_prefix = ../data/adapted/BikeNYC/random_0.4/channel_0/split

[train]
miss_rate = 0.4
type = random
epochs = 100
batch_size = 16
lr = 0.0001
use_nni = 0
test_ratio = 0.2
val_ratio = 0.2
sample_len = 12
val_epoch = 10

[diffusion]
layers = 4
channels = 64
nheads = 8
diffusion_embedding_dim = 64
beta_start = 0.0001
beta_end = 0.5
num_steps = 100
nsample = 10
schedule = quad
val_nsample = 1

[model]
timeemb = 128
featureemb = 16
target_strategy = mix

