[data]
data_prefix = ../data/adapted/BikeNYC/random_0.6/channel_0/split
dataset = BikeNYC
miss_rate = 0.6
type = random
num_nodes = 288
seq_len = 12
val_ratio = 0.2
test_ratio = 0.2
tod = False
normalizer = std
column_wise = False
default_graph = True

[model]
input_dim = 1
output_dim = 1
embed_dim = 10
rnn_units = 64
num_layers = 2
cheb_order = 2

[train]
use_nni = 0
loss_func = mae
seed = 42
batch_size = 32
epochs = 100
lr_init = 0.003
lr_decay = False
lr_decay_rate = 0.3
lr_decay_step = 5,20,40,70
early_stop = True
early_stop_patience = 4
grad_norm = False
max_grad_norm = 5
real_value = True
val_epoch = 5

[test]
mae_thresh = None
mape_thresh = 0.

[log]
log_step = 20
plot = False

